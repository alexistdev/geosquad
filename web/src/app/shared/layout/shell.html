<div id="layout-wrapper">

  <header id="page-topbar">
    <div class="layout-width">
      <div class="navbar-header">
        <div class="d-flex align-items-center">
          <div class="navbar-brand-box horizontal-logo">
            <a [routerLink]="auth.homeUrlFor(auth.user()?.role)" class="logo logo-dark">
              <span class="logo-sm"><span class="brand-mark">GS</span></span>
              <span class="logo-lg"><span class="brand-word">GeoSquad</span></span>
            </a>
          </div>

          <button
            type="button"
            class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger"
            (click)="toggleSidebar()"
            aria-label="Buka atau tutup menu"
          >
            <span class="hamburger-icon"><span></span><span></span><span></span></span>
          </button>
        </div>

        <div class="d-flex align-items-center">
          <button
            type="button"
            class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
            (click)="theme.toggleMode()"
            [attr.aria-label]="theme.mode() === 'dark' ? 'Ganti ke mode terang' : 'Ganti ke mode gelap'"
          >
            <i class="fs-22" [class.ri-moon-line]="theme.mode() === 'light'" [class.ri-sun-line]="theme.mode() === 'dark'"></i>
          </button>

          <div class="dropdown ms-sm-3 header-item topbar-user" [class.show]="menuOpen()">
            <button type="button" class="btn" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()">
              <span class="d-flex align-items-center">
                <span class="avatar-xs rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-semibold">
                  {{ initials() }}
                </span>
                <span class="text-start ms-xl-2">
                  <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">{{ auth.user()?.fullName }}</span>
                  <span class="d-none d-xl-block ms-1 fs-12 text-muted user-name-sub-text">{{ auth.user()?.role }}</span>
                </span>
              </span>
            </button>

            <div class="dropdown-menu dropdown-menu-end" [class.show]="menuOpen()">
              <h6 class="dropdown-header">{{ auth.user()?.email }}</h6>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item" type="button" (click)="logout()">
                <i class="ri-logout-box-r-line text-muted fs-16 align-middle me-1"></i>
                <span class="align-middle">Keluar</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="app-menu navbar-menu">
    <div class="navbar-brand-box">
      <a [routerLink]="auth.homeUrlFor(auth.user()?.role)" class="logo logo-light">
        <span class="logo-sm"><span class="brand-mark">GS</span></span>
        <span class="logo-lg"><span class="brand-word">GeoSquad</span></span>
      </a>
    </div>

    <div id="scrollbar">
      <div class="container-fluid">
        <ul class="navbar-nav" id="navbar-nav">
          <li class="menu-title"><span>Menu</span></li>

          @if (auth.isAdmin()) {
            <li class="nav-item">
              <a class="nav-link menu-link" routerLink="/admin/dashboard" routerLinkActive="active">
                <i class="ri-dashboard-2-line"></i> <span>Dashboard</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link menu-link" routerLink="/admin/users" routerLinkActive="active">
                <i class="ri-team-line"></i> <span>Manajemen User</span>
              </a>
            </li>
          } @else {
            <li class="nav-item">
              <a class="nav-link menu-link" routerLink="/user/dashboard" routerLinkActive="active">
                <i class="ri-dashboard-2-line"></i> <span>Dashboard</span>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>

    <div class="sidebar-background"></div>
  </div>

  <!-- Lapisan gelap di belakang sidebar melayang pada layar sempit. -->
  <div class="vertical-overlay" (click)="theme.closeMobileSidebar()"></div>

  <div class="main-content">
    <div class="page-content">
      <div class="container-fluid">
        <router-outlet />
      </div>
    </div>

    <footer class="footer">
      <div class="container-fluid">
        <div class="row">
          <div class="col-12 text-center text-sm-start">
            <span class="text-muted">GeoSquad</span>
          </div>
        </div>
      </div>
    </footer>
  </div>
</div>
