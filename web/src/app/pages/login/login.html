<div class="auth-page-wrapper py-5 d-flex justify-content-center align-items-center min-vh-100">
  <div class="auth-page-content">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">

          <div class="text-center mb-4">
            <span class="brand-mark mb-3">GS</span>
            <h4 class="mb-1">Masuk ke GeoSquad</h4>
            <p class="text-muted mb-0">Jalankan squad AI dan pantau hasilnya.</p>
          </div>

          <div class="card mt-3">
            <div class="card-body p-4">

              @if (sessionExpired()) {
                <div class="alert alert-info" role="status">
                  Sesi kamu sudah berakhir. Silakan masuk lagi.
                </div>
              }
              @if (error()) {
                <div class="alert alert-danger" role="alert">{{ error() }}</div>
              }

              <form (ngSubmit)="submit()" #form="ngForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    [(ngModel)]="email"
                    required
                    autocomplete="email"
                    autofocus
                    [disabled]="loading()"
                    placeholder="nama@contoh.com"
                  />
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    [(ngModel)]="password"
                    required
                    autocomplete="current-password"
                    [disabled]="loading()"
                    placeholder="Masukkan password"
                  />
                </div>

                <div class="mt-4">
                  <button
                    class="btn btn-primary w-100"
                    type="submit"
                    [disabled]="loading() || form.invalid"
                  >
                    @if (loading()) {
                      <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
                      Memproses...
                    } @else {
                      Masuk
                    }
                  </button>
                </div>
              </form>
            </div>
          </div>

          <div class="mt-4 text-center">
            <p class="mb-0">
              Belum punya akun?
              <a routerLink="/register" class="fw-semibold text-primary text-decoration-underline">Daftar di sini</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
